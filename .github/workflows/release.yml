name: Build and Release

on:
  push:
    tags:
      - 'v*'
  # Manual runs build all platforms but skip the release upload (no tag).
  # The Linux job uploads its output as a workflow artifact instead, so
  # builds can be tested/shared without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout (full history for git describe)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11.0
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.0'

      - name: Cache Nuitka toolchain downloads
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-mingw64-${{ runner.os }}

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate version file
        run: python write_version.py

      - name: Build executable with Nuitka
        shell: cmd
        run: build_exe.bat

      - name: Install Inno Setup 6
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: cmd
        run: windows_build_scripts\build_inno_installer.bat

      - name: Upload installer to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: win_installer/FreeCCR_Install_*.exe
          # Release notes shown on every release page.
          # KEEP IN SYNC with the macOS and Linux jobs' upload steps below.
          # The body is static. REPLACE "## What's New" with ONLY this release's
          # changes each time — do not append past versions (git history keeps them).
          body: |
            ## What's New

            **FreeCCR 1.2.0** — one-click auto white balance, a major dust-removal upgrade, and the first Linux builds.

            - **Auto White Balance.** New **AWB** button next to the WB picker: one click estimates the neutral colour of the converted frame and sets the Temperature/Tint sliders — no grey spot to hunt for, undoable, and re-clicking gives the same answer. **Settings → General** picks the estimator (Gray World, White Patch, Shades of Gray, Gray Edge) and can run AWB automatically after each conversion (off by default; images that already have a white balance are never touched).
            - **Linux builds.** Releases now ship a Linux x86_64 **AppImage** and a portable **tar.gz** — install notes below.
            - **Dust removal overhaul.**
              - **Dust mode edits the framed image** — the crop you keep, not the full scan — and healing is resolution-independent: **exports now match the preview exactly**.
              - **Auto-detection finds far more dust.** Detection runs tiled at the scan's native resolution with a noise-relative brightness gate, so the soft out-of-focus specks the old 1080px pass missed are found; it looks only in smooth areas where specks actually show, stays inside your crop, and uses the GPU on Windows when available. Also fixed: detection returned nothing on B/W-point-converted images.
              - **Cleaner heals.** Source patches are searched nearest-first by texture match, every spot samples its own patch (nearby strokes no longer share one), healed tone anchors to its local surroundings, and feather scales with the brush size.
              - **Editable heals.** With heal sources shown: right-drag a stroke to move it (it keeps sampling the same patch of film), right-drag a source ring to re-pick where it samples, double right-click deletes a stroke.
            - **Reference-frame exports are faithful.** Exports now replay the exact reference frame captured at convert time, so changing the reference afterwards can no longer alter an export (#94).

            ## Install

            ### Windows
            Download the installer (`FreeCCR_Install_*.exe`) from the **Assets** below and run it.

            ### macOS (Apple Silicon)
            Download `FreeCCR_macOS_*.zip` from the **Assets**, unzip it, and move `FreeCCR.app` into your **Applications** folder.

            ⚠️ **macOS may say the app is "damaged and can't be opened" — it isn't.** FreeCCR isn't notarized by Apple, so Gatekeeper blocks unsigned downloads on first launch. Clear the quarantine flag once by running this in **Terminal**:

            ```
            xattr -d com.apple.quarantine /Applications/FreeCCR.app
            ```

            Then open the app normally.

            *Alternative:* right-click the app → **Open** → **Open**. On macOS Sequoia (15), if no "Open" button appears, use the Terminal command above, or go to **System Settings → Privacy & Security → Open Anyway**.

            ### Linux (x86_64)
            **AppImage (recommended):** download `FreeCCR_Linux_*-x86_64.AppImage` from the **Assets**, make it executable, and run it:

            ```
            chmod +x FreeCCR_Linux_*-x86_64.AppImage
            ./FreeCCR_Linux_*-x86_64.AppImage
            ```

            **Portable folder:** download `FreeCCR_Linux_*-x86_64.tar.gz`, extract it anywhere, and run `FreeCCR/FreeCCR`. Fully self-contained — no Python or packages to install.

            Built on Ubuntu 22.04, so it runs on any x86_64 distro with glibc 2.35 or newer: Ubuntu 22.04+, Linux Mint 21+, Debian 12+, Fedora 36+, openSUSE, Arch, etc.

  build-macos:
    runs-on: macos-latest  # ARM64 (Apple Silicon)

    steps:
      - name: Checkout (full history for git describe)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11.0
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.0'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate version file
        run: python write_version.py

      - name: Get version
        id: version
        run: echo "version=$(python -c "import sys; sys.path.append('src'); from version import VERSION; print(VERSION)")" >> "$GITHUB_OUTPUT"

      - name: Build executable with Nuitka
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          PYOPENCL_CL_DIR=$(python -c "import pyopencl, os; print(os.path.join(os.path.dirname(pyopencl.__file__), 'cl'))")
          python -m nuitka \
            --clang \
            --standalone \
            --include-package=numpy \
            --include-package=utils \
            --include-package=pyopencl \
            --include-package=imagecodecs \
            --include-package-data=imagecodecs \
            --include-data-dir="$PYOPENCL_CL_DIR=pyopencl/cl" \
            --enable-plugin=pyside6 \
            --include-data-dir=src/icons=icons \
            --include-data-dir=LICENSES=LICENSES \
            --nofollow-import-to=doctest \
            --nofollow-import-to=IPython \
            src/main.py

      - name: Assemble .app bundle (unsigned)
        run: |
          APP="FreeCCR.app"
          MACOS_DIR="$APP/Contents/MacOS"
          RESOURCES_DIR="$APP/Contents/Resources"

          rm -rf "$APP"
          mkdir -p "$MACOS_DIR" "$RESOURCES_DIR"

          cp main.dist/main.bin "$MACOS_DIR/FreeCCR"
          chmod +x "$MACOS_DIR/FreeCCR"
          cp macos_build_scripts/Info.plist "$APP/Contents/Info.plist"

          [ -f src/icons/freeccr_logo.icns ] && cp src/icons/freeccr_logo.icns "$RESOURCES_DIR/freeccr_logo.icns"

          cp -R main.dist/* "$MACOS_DIR/"
          rm -f "$MACOS_DIR/main.bin"

          xattr -cr "$APP" 2>/dev/null || true

      - name: Zip .app bundle
        run: zip -r "FreeCCR_macOS_${{ steps.version.outputs.version }}.zip" FreeCCR.app

      - name: Upload to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: FreeCCR_macOS_*.zip
          # Release notes shown on every release page.
          # KEEP IN SYNC with the Windows and Linux jobs' upload steps.
          # The body is static. REPLACE "## What's New" with ONLY this release's
          # changes each time — do not append past versions (git history keeps them).
          body: |
            ## What's New

            **FreeCCR 1.2.0** — one-click auto white balance, a major dust-removal upgrade, and the first Linux builds.

            - **Auto White Balance.** New **AWB** button next to the WB picker: one click estimates the neutral colour of the converted frame and sets the Temperature/Tint sliders — no grey spot to hunt for, undoable, and re-clicking gives the same answer. **Settings → General** picks the estimator (Gray World, White Patch, Shades of Gray, Gray Edge) and can run AWB automatically after each conversion (off by default; images that already have a white balance are never touched).
            - **Linux builds.** Releases now ship a Linux x86_64 **AppImage** and a portable **tar.gz** — install notes below.
            - **Dust removal overhaul.**
              - **Dust mode edits the framed image** — the crop you keep, not the full scan — and healing is resolution-independent: **exports now match the preview exactly**.
              - **Auto-detection finds far more dust.** Detection runs tiled at the scan's native resolution with a noise-relative brightness gate, so the soft out-of-focus specks the old 1080px pass missed are found; it looks only in smooth areas where specks actually show, stays inside your crop, and uses the GPU on Windows when available. Also fixed: detection returned nothing on B/W-point-converted images.
